[project]
name = "cqa"
version = "0.1.0"
description = "Conversation Quality Analytics: бэкенд API (Data Challenge'26, кейс Freedom Broker)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.115",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "pytest>=8.3",
    "ruff>=0.8",
    "uvicorn>=0.32",
]

# Vercel: FastAPI-приложение `app` из app/main.py (zero-config путь, указан явно,
# чтобы модуль грузился как пакет app.main). vercel.json не нужен.
[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # assert в тестах

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
