<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Стенд Dynamics 365 — решение CQA</title>
  <meta name="description" content="Макет model-driven app с решением CQA: экраны оценки качества — веб-ресурсы в области содержимого, панель оценки — во вкладке «Качество» формы обращения.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="shell.css">
  <!-- Команда формы — тот же JavaScript web resource, что загружается в решение Dynamics (классический скрипт). -->
  <script src="../js/embed/command.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body class="d365-body">
  <div id="d365-root" class="d365">
    <noscript>
      <p class="d365-noscript">Для работы стенда нужен JavaScript.</p>
    </noscript>
  </div>
</body>
</html>
